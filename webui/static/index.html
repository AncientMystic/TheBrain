<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheBrain WebUI (skeleton)</title>
<style>
:root{--bg1:#0b1026;--bg2:#2b1055;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--txt:#f2f5ff;--mut:#aab4d4;--acc1:#22d3ee;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui;color:var(--txt);background:radial-gradient(1200px 800px at 20% 10%,#1b2a6b,transparent),radial-gradient(1000px 700px at 85% 20%,#5b21b6,transparent),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
.rail{position:fixed;left:0;top:0;bottom:0;width:78px;display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 0;background:rgba(0,0,0,.25);backdrop-filter:blur(18px);border-right:1px solid var(--line);overflow-y:auto}
.rail button{width:62px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.rail button .ic{font-size:18px;line-height:1}
.rail button .lb{font-size:9px;line-height:1.2;color:var(--mut)}
.rail button.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#06121f;border:none}
.rail button.on .lb{color:#06121f}
.main{margin-left:78px;padding:18px;max-width:1200px}
#gr-canvas text{user-select:none;-webkit-user-select:none;pointer-events:none}
#gr-canvas g{pointer-events:all}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);font-size:12px;color:var(--mut)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.35);margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}label{font-size:12px;color:var(--mut)}input,select,textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{padding:9px 14px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#06121f;font-weight:700}
.btn.ghost{background:var(--glass);color:var(--txt);border:1px solid var(--line)}
.term{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:12px;padding:10px;height:220px;overflow:auto;font:12px/1.5 ui-monospace,Consolas;white-space:pre-wrap}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc1),var(--acc2))}
.docs{margin-top:10px;display:grid;gap:6px}.doc{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25);font-size:12px}
.cfg-group{margin-bottom:12px}.cfg-item{display:grid;grid-template-columns:220px 1fr;gap:10px;padding:8px;border-bottom:1px solid var(--line);align-items:center}.cfg-item small{color:var(--mut);display:block}
.tab{display:none}.tab.on{display:block}
</style>
</head>
<body>
<div class="rail" id="rail"></div>
<div class="main">
<div class="top"><span class="pill" id="health">health…</span><input id="token" placeholder="Bearer token (memory only)" style="max-width:260px"><button class="btn ghost" onclick="saveToken()">Use token</button><input id="q" placeholder="Search config…" style="max-width:220px" oninput="renderConfig()"></div>

<div class="tab card" data-tab="Guided"><h2>🧭 Guided Learning</h2>
<div class="row"><div><label>Input folder (server path)</label><input id="g-input" value="A:/pdfs"></div><div><label>Limit files (empty = all)</label><input id="g-limit" placeholder=""></div></div>
<div class="row3" style="margin-top:8px"><label><input type="checkbox" id="g-verified"> Verified folder</label><label><input type="checkbox" id="g-logic"> Use logic modules</label><label><input type="checkbox" id="g-dry"> Dry run</label></div>
<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="startGuided()">Start</button><button class="btn ghost" onclick="cancelJob()">Cancel</button></div>
<div class="term" id="g-term"></div><div class="bar"><i id="g-bar"></i></div><div class="docs" id="g-docs"></div>
</div>

<div class="tab card" data-tab="Config"><h2>⚙️ Full Config (every option + what it does)</h2>
<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn" onclick="saveConfig()">Save session overrides</button><button class="btn ghost" onclick="loadSchema()">Reload</button><span id="cfg-msg" style="color:var(--mut);font-size:12px"></span></div>
<div id="cfg"></div></div>
<div class="tab card" data-tab="Chat"><h2>💬 Chat</h2>
<div class="row"><div><label>Session (blank = new each time)</label><input id="c-session" placeholder="e.g. research-1"></div><div style="display:flex;gap:14px;align-items:end;padding-bottom:8px"><label><input type="checkbox" id="c-reason"> Verification-first reasoning</label><label><input type="checkbox" id="c-deep"> Deep research</label></div></div>
<textarea id="c-q" rows="3" placeholder="Ask anything — tip: start with remember: to store a memory"></textarea>
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick="sendChat()">Send</button><button class="btn ghost" onclick="document.getElementById('c-a').innerHTML=''">Clear</button></div>
<div id="c-a" style="margin-top:10px;display:grid;gap:8px"></div>
</div>
<div class="tab card" data-tab="Graph"><h2>🕸️ Deep Graph — mindmap of database</h2>
<div style="display:flex;gap:8px;margin-bottom:8px"><input id="gr-q" placeholder="Filter nodes…" style="max-width:240px"><button class="btn ghost" onclick="loadGraph()">Load</button><button class="btn ghost" onclick="clearGraph()">Clear</button></div>
<svg id="gr-canvas" width="100%" height="420" style="background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;cursor:grab"></svg>
<div id="gr-menu" style="display:none;position:fixed;z-index:50;background:rgba(10,14,30,.95);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px"></div>
<h3 style="margin:10px 0 6px;font-size:13px;color:var(--mut)">Log (graph actions + backend notes)</h3>
<div class="term" id="gr-log" style="height:130px"></div>
</div>
<div class="tab card" data-tab="Recoll"><h2>🔎 Recoll</h2>
<div class="row"><div><label>Query (also filled from Graph right-click)</label><input id="r-q" placeholder="keyword"></div><div><label>Limit</label><input id="r-limit" value="20"></div></div>
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="recollSearch()">Search</button><button class="btn ghost" onclick="recollFast()">Fast preview</button><button class="btn ghost" onclick="recollStatus()">Binary status</button></div>
<div class="term" id="r-term" style="margin-top:10px;height:180px"></div><div id="r-res" style="margin-top:8px;display:grid;gap:6px"></div>
</div>
<div class="tab card" data-tab="Audit"><h2>🛡️ Audit &amp; Review</h2>
<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" onclick="startAudit()">Run audit</button><button class="btn ghost" onclick="loadReview()">Refresh review queue</button></div>
<div class="term" id="a-term" style="height:130px"></div><div class="bar"><i id="a-bar"></i></div>
<div id="a-review" style="margin-top:8px;display:grid;gap:6px"></div>
</div>
<div class="tab card" data-tab="Server"><h2>🖥️ Server &amp; Health</h2>
<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="btn ghost" onclick="serverEndpoints()">Endpoints</button><button class="btn ghost" onclick="serverDbs()">Databases</button><button class="btn ghost" onclick="serverMetrics()">Metrics tail</button></div>
<div class="term" id="s-term" style="height:200px"></div><div id="s-tables" style="margin-top:8px;display:grid;gap:6px"></div>
</div>
<div class="tab card" data-tab="Research"><h2>🔬 Deep Research</h2>
<div class="row"><div><label>Query</label><input id="rs-q" placeholder="research topic"></div><div><label>Session (optional)</label><input id="rs-s" placeholder=""></div></div>
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:end"><button class="btn" onclick="startResearch()">Generate report</button><button class="btn ghost" onclick="listReports()">Refresh reports</button><div><label>Save previewed report to</label><div style="display:flex;gap:6px"><select id="rs-fmt" style="max-width:110px"><option value=".md">.md</option><option value=".pdf">.pdf</option></select><button class="btn ghost" onclick="saveReport()">Save to</button></div></div></div>
<div class="term" id="rs-term" style="height:130px;margin-top:10px"></div><div class="bar"><i id="rs-bar"></i></div>
<div id="rs-list" style="margin-top:8px;display:grid;gap:6px"></div>
<div class="term" id="rs-preview" style="height:220px;margin-top:8px"></div>
</div>
<div class="tab card" data-tab="Logic"><h2>🧠 Logic &amp; Memory</h2>
<div class="row"><div><label>Module search</label><input id="l-q" placeholder="name, category or summary"></div><div><label>Session filter (blank = all)</label><input id="l-session" placeholder="session id"></div></div>
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="loadModules()">Modules</button><button class="btn ghost" onclick="loadSessions()">Sessions</button><button class="btn ghost" onclick="loadMemories()">Memories</button><button class="btn ghost" onclick="startConsolidate()">Consolidate memories</button></div>
<div class="term" id="l-term" style="height:110px;margin-top:8px"></div><div id="l-list" style="margin-top:8px;display:grid;gap:6px"></div>
<hr style="border-color:var(--line);margin:14px 0">
<h2>📚 Learn from folder</h2>
<div class="row"><div><label>Input folder</label><input id="ll-input" value="A:/logic_examples"></div><div><label>Limit (blank = all)</label><input id="ll-limit" placeholder=""></div></div>
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick="startLogicLearn()">Start learning</button><button class="btn ghost" onclick="cancelLogic()">Cancel</button><label style="align-self:center"><input type="checkbox" id="ll-dry"> Dry run</label></div>
<div class="term" id="ll-term" style="height:130px;margin-top:8px"></div><div class="bar"><i id="ll-bar"></i></div><div class="docs" id="ll-docs"></div>
</div>
</div>
<script>
const TABS=["Guided","Chat","Graph","Recoll","Audit","Server","Research","Logic","Config"];let cur="Guided",token="",job=null,schema=null,ajob=null,rsjob=null;
const rail=document.getElementById("rail");
const ICONS={Guided:"🧭",Chat:"💬",Graph:"🕸️",Recoll:"🔎",Audit:"🛡️",Server:"🖥️",Research:"🔬",Logic:"🧠",Config:"⚙️"};
TABS.forEach(t=>{const b=document.createElement("button");b.title=t;const ic=document.createElement("span");ic.className="ic";ic.textContent=ICONS[t];const lb=document.createElement("span");lb.className="lb";lb.textContent=t;b.appendChild(ic);b.appendChild(lb);b.onclick=()=>show(t);b.dataset.t=t;rail.appendChild(b)});
function show(t){cur=t;document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));document.querySelectorAll(".tab").forEach(d=>d.classList.toggle("on",d.dataset.tab===t));if(t==="Config")renderConfig()}
function saveToken(){token=document.getElementById("token").value;log("g-term","token kept in memory only")}
function auth(){return token?{"Authorization":"Bearer "+token}:{}}
function log(id,m){const e=document.getElementById(id);e.textContent+=m+"\n";e.scrollTop=e.scrollHeight}
async function health(){try{const r=await fetch("/api/health/summary");const j=await r.json();document.getElementById("health").textContent=`endpoints ${j.llm_endpoints} · ${j.embedding_model} ${j.embedding_dim}d`}catch(e){document.getElementById("health").textContent="backend offline (UI skeleton still works)"}}
async function loadSchema(){try{const r=await fetch("/api/config/schema",{headers:auth()});if(!r.ok)throw 0;schema=await r.json();renderConfig()}catch(e){document.getElementById("cfg").innerHTML="<p style='color:var(--mut)'>Set token above if auth is on, then reopen Config.</p>"}}
function renderConfig(){if(!schema)return;const q=(document.getElementById("q").value||"").toLowerCase();const box=document.getElementById("cfg");box.innerHTML="";schema.groups.forEach(g=>{const items=schema.items.filter(it=>it.group===g&&(!q||it.key.toLowerCase().includes(q)||it.doc.toLowerCase().includes(q)));if(!items.length)return;const d=document.createElement("div");d.className="cfg-group";d.innerHTML=`<h2>${g}</h2>`;items.forEach(it=>{const row=document.createElement("div");row.className="cfg-item";let ctrl="";if(it.kind==="bool"){ctrl=`<input type="checkbox" data-k="${it.key}" ${it.value?"checked":""}>`}else if(it.kind==="json"){ctrl=`<input data-k="${it.key}" value='${JSON.stringify(it.value??"").slice(0,120)}' title="JSON — edit carefully">`}else{ctrl=`<input data-k="${it.key}" value="${String(it.value??"").replace(/"/g,"&quot;").slice(0,200)}">`}row.innerHTML=`<div><b>${it.key}</b><small>${it.doc}</small></div><div>${ctrl}</div>`;d.appendChild(row)});box.appendChild(d)})}
async function saveConfig(){const payload={};document.querySelectorAll("#cfg [data-k]").forEach(el=>{const k=el.dataset.k;payload[k]=el.type==="checkbox"?el.checked:el.value});const msg=document.getElementById("cfg-msg");msg.textContent="saving…";try{let r=await fetch("/api/config",{method:"PUT",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(payload)});let j=await r.json();if(j.warnings&&j.warnings.confirm){if(!confirm(j.warnings.confirm+" Save anyway with migration planned?")){msg.textContent="cancelled — no changes applied";return}payload.confirm_model_switch=true;r=await fetch("/api/config",{method:"PUT",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(payload)});j=await r.json()}const n=Object.keys(j.applied||{}).length,e=Object.keys(j.errors||{}).length,w=Object.keys(j.warnings||{}).length;msg.textContent=`applied ${n}, errors ${e}, warnings ${w}${j.restart_required?" — restart server for host/port/model to take effect":""}`;if(w)msg.textContent+=" — see console";console.log("config save",j);loadSchema()}catch(e){msg.textContent="save failed — check token"}}
async function startGuided(){const payload={input:document.getElementById("g-input").value,limit:document.getElementById("g-limit").value,verified:document.getElementById("g-verified").checked,logic:document.getElementById("g-logic").checked,dry:document.getElementById("g-dry").checked};document.getElementById("g-docs").innerHTML="";document.getElementById("g-bar").style.width="0";try{const r=await fetch("/api/jobs/guided",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();job=j.job_id;log("g-term","job "+job);stream()}catch(e){log("g-term","backend offline — skeleton stream unavailable")}}
async function stream(){if(!job)return;const es=new EventSource(`/api/jobs/${job}/stream`);es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="log")log("g-term",m.msg);if(m.type==="progress")document.getElementById("g-bar").style.width=(100*m.done/m.total)+"%";if(m.type==="document"){const d=document.createElement("div");d.className="doc";d.innerHTML=`<span>${m.name}</span><span>${m.chunks} chunks</span><span>${m.facts} facts</span><span>✅</span>`;document.getElementById("g-docs").appendChild(d)}if(m.type==="done"){log("g-term","done ok="+m.ok);es.close()}};es.onerror=()=>es.close()}
async function cancelJob(){if(!job)return;await fetch(`/api/jobs/${job}/cancel`,{method:"POST",headers:auth()});log("g-term","cancel sent")}
function recollShow(list){const box=document.getElementById("r-res");box.innerHTML="";(list||[]).forEach(r=>{const d=document.createElement("div");d.className="doc";d.innerHTML=`<span><b>${String(r.title||r.path||"").replace(/</g,"&lt;").slice(0,80)}</b><br><span style="color:var(--mut)">${String(r.snippet||"").replace(/</g,"&lt;").slice(0,200)}</span></span><span style="color:var(--mut)">${String(r.path||"").replace(/</g,"&lt;").slice(0,40)}</span>`;box.appendChild(d)})}
async function recollSearch(){const q=document.getElementById("r-q").value.trim();if(!q)return;log("r-term","search: "+q);try{const r=await fetch("/api/recoll/search",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({query:q,limit:parseInt(document.getElementById("r-limit").value||"20")})});const j=await r.json();if(j.error)log("r-term","note: "+j.error);log("r-term",`found ${(j.results||[]).length} in ${j.ms||0}ms`);recollShow(j.results)}catch(e){log("r-term","failed — check token and recollq binary")}}
async function recollFast(){const q=document.getElementById("r-q").value.trim();log("r-term","fast preview: "+(q||"(empty)"));try{const r=await fetch("/api/recoll/fast",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({keyword:q,limit:parseInt(document.getElementById("r-limit").value||"20")})});const j=await r.json();log("r-term",`preview ${(j.results||[]).length} in ${j.ms||0}ms (full fast-mode pipeline job lands next)`);recollShow(j.results)}catch(e){log("r-term","failed")}}
async function recollStatus(){try{const r=await fetch("/api/recoll/status",{headers:auth()});const j=await r.json();log("r-term",`binary ${j.binary} available=${j.available} db=${j.db||"(default)"}`)}catch(e){log("r-term","status failed")}}
(function(){try{const q=localStorage.getItem("recoll_query");if(q){const el=document.getElementById("r-q");if(el&&!el.value)el.value=q;localStorage.removeItem("recoll_query")}}catch(e){}})()
async function startAudit(){try{const r=await fetch("/api/jobs/audit",{method:"POST",headers:auth()});const j=await r.json();ajob=j.job_id;log("a-term","job "+ajob);const es=new EventSource(`/api/jobs/${ajob}/stream`);es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="log")log("a-term",m.msg);if(m.type==="progress")document.getElementById("a-bar").style.width=(100*m.done/Math.max(1,m.total))+"%";if(m.type==="done"){log("a-term","done ok="+m.ok);es.close();loadReview()}};es.onerror=()=>es.close()}catch(e){log("a-term","failed — check token")}}
async function loadReview(){try{const r=await fetch("/api/review?limit=100",{headers:auth()});const j=await r.json();const box=document.getElementById("a-review");box.innerHTML="";(j.items||[]).forEach(it=>{const d=document.createElement("div");d.className="doc";d.innerHTML=`<span><b>#${it.id}</b> ${String(it.details||"").replace(/</g,"&lt;").slice(0,160)}</span><span style="color:var(--mut)">${it.triple_a||""} ↔ ${it.triple_b||""}</span>`;const b1=document.createElement("button");b1.className="btn ghost";b1.textContent="Resolve";b1.onclick=()=>resolveItem(it.id,"resolved");const b2=document.createElement("button");b2.className="btn ghost";b2.textContent="Dismiss";b2.onclick=()=>resolveItem(it.id,"dismissed");d.appendChild(b1);d.appendChild(b2);box.appendChild(d)});if(!(j.items||[]).length)log("a-term","review queue empty — nothing awaiting review")}catch(e){log("a-term","review load failed")}}
async function resolveItem(id,decision){const note=prompt(`Note for ${decision} #${id} (optional):`)||"";try{const r=await fetch(`/api/review/${id}/resolve`,{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({decision,note})});const j=await r.json();log("a-term",j.ok?`#${id} ${decision}`:`failed: ${j.error||""}`);loadReview()}catch(e){log("a-term","resolve failed")}}
async function serverEndpoints(){try{const r=await fetch("/api/server/endpoints",{headers:auth()});const j=await r.json();const box=document.getElementById("s-tables");box.innerHTML="";(j.endpoints||[]).forEach(e=>{const d=document.createElement("div");d.className="doc";d.innerHTML=`<span><b>${String(e.model||"").replace(/</g,"&lt;")}</b> <span style="color:var(--mut)">${String(e.backend||"")} ${String(e.url||"").slice(0,40)}</span></span><span>${e.ok?"✅":"❌"} ${e.ms||0}ms</span>`;box.appendChild(d)});log("s-term",`endpoints: ${(j.endpoints||[]).filter(e=>e.ok).length}/${(j.endpoints||[]).length} ok`)}catch(e){log("s-term","endpoints failed")}}
async function serverDbs(){try{const r=await fetch("/api/server/dbs",{headers:auth()});const j=await r.json();const box=document.getElementById("s-tables");box.innerHTML="";(j.dbs||[]).forEach(d=>{const el=document.createElement("div");el.className="doc";el.innerHTML=`<span>${d.name}</span><span style="color:var(--mut)">${d.mb} MB</span>`;box.appendChild(el)});log("s-term",`databases: ${(j.dbs||[]).length} listed`)}catch(e){log("s-term","db list failed")}}
async function serverMetrics(){try{const r=await fetch("/api/server/metrics?lines=60",{headers:auth()});const j=await r.json();log("s-term",(j.metrics||j.error||"(empty)").slice(0,2000))}catch(e){log("s-term","metrics failed")}}
async function sendChat(){const q=document.getElementById("c-q").value.trim();if(!q)return;const box=document.getElementById("c-a");const card=document.createElement("div");card.className="card";card.innerHTML=`<div><b>You</b><p>${q.replace(/</g,"&lt;")}</p></div><div style="color:var(--mut)">thinking…</div>`;box.prepend(card);try{const r=await fetch("/api/chat",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({query:q,session_id:document.getElementById("c-session").value||null,reasoning:document.getElementById("c-reason").checked,deep_research:document.getElementById("c-deep").checked})});const j=await r.json();const seenF=new Set();const feet=[];(j.facts||[]).forEach(f=>{const t=String(f.fact_text||"").replace(/\s+/g," ").trim();const k=t.toLowerCase();if(!t||seenF.has(k))return;seenF.add(k);let c=parseFloat(f.confidence||0);c=c<=1?Math.round(c*100):Math.round(c);feet.push({tag:"S"+(feet.length+1),doc:f.doc||"unknown",conf:c,text:t})});const fmap=new Map(feet.map(f=>[f.tag,f]));let notes=feet.length?`<div style="font-size:12px;margin-top:8px;color:var(--mut)"><b>Sources</b></div>`+feet.map(f=>`<div id="fn-${f.tag}" style="font-size:12px;color:var(--mut)">[${f.tag}] ${String(f.doc).replace(/</g,"&lt;")} <i>${f.conf}%</i> — ${String(f.text).slice(0,100).replace(/</g,"&lt;")}</div>`).join(""):"";card.innerHTML=`<div><b>You</b><p>${q.replace(/</g,"&lt;")}</p></div><div><b>Assistant</b> <span style="color:var(--mut)">${j.ms||0}ms</span>${j.served&&j.served.model?`<span class="pill" style="margin-left:6px" title="${String(j.served.url||"").replace(/</g,"&lt;")}">${String(j.served.model).replace(/</g,"&lt;")}</span>`:""}<div>${renderMarkdown(String(j.answer||"").slice(0,12000),fmap)}</div>${notes}</div>`}catch(e){card.innerHTML+=`<div style="color:var(--bad)">failed — check token and backend</div>`}}
function renderMarkdown(src,feet){try{
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let t=esc(src);
t=t.replace(/!\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1");
t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");
const inline=s=>{s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");if(feet){s=s.replace(/\[S(\d+)\]/g,(m,n)=>feet.has("S"+n)?`<sup><a href="#fn-S${n}">[S${n}]</a></sup>`:m)}return s};
const isTableRow=l=>/^\s*\|.*\|\s*$/.test(l);
const isDelim=l=>/^\s*\|?[\s:|\-]+\|?\s*$/.test(l)&&/-/.test(l);
const renderTable=rows=>{const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));const h=cells(rows[0]);let html="<table style='border-collapse:collapse;margin:6px 0;font-size:12px'>";html+="<tr>"+h.map(c=>`<th style='border:1px solid var(--line);padding:4px 8px;text-align:left'>${c}</th>`).join("")+"</tr>";for(let i=2;i<rows.length;i++){html+="<tr>"+cells(rows[i]).map(c=>`<td style='border:1px solid var(--line);padding:4px 8px'>${c}</td>`).join("")+"</tr>"}return html+"</table>"};
const lines=t.split("\n");let html="",para=[],inUl=false,inOl=false,tbuf=[];
const flushP=()=>{if(para.length){html+=`<p>${para.join("<br>")}</p>`;para=[]}};
const flushL=()=>{if(inUl){html+="</ul>";inUl=false}if(inOl){html+="</ol>";inOl=false}};
const flushT=()=>{if(tbuf.length>1){html+=renderTable(tbuf)}else if(tbuf.length){html+=`<p>${inline(tbuf[0])}</p>`}tbuf=[]};
for(let li=0;li<lines.length;li++){const ln=lines[li];const s=ln.trim();
if(!s){flushT();flushL();flushP();continue}
if(isTableRow(ln)&&(tbuf.length||(lines[li+1]&&isDelim(lines[li+1])))){flushL();flushP();tbuf.push(ln);continue}
if(tbuf.length){if(isDelim(ln)){tbuf.push(ln);continue}flushT()}
const hm=s.match(/^(#{1,3})\s+(.*)$/);if(hm){flushL();flushP();const lv=hm[1].length;html+=`<h${lv+2}>${inline(hm[2])}</h${lv+2}>`;continue}
let m=ln.match(/^\s*[-*•]\s+(.*)$/);if(m){flushP();if(!inUl){html+="<ul>";inUl=true}html+=`<li>${inline(m[1])}</li>`;continue}
m=ln.match(/^\s*(\d+)\.\s+(.*)$/);if(m){flushP();if(!inOl){html+="<ol>";inOl=true}html+=`<li>${inline(m[2])}</li>`;continue}
flushL();para.push(inline(ln.trim()))}
flushT();flushL();flushP();return html||"<p></p>"}catch(e){return `<p>${String(src||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").slice(0,12000).replace(/\n/g,"<br>")}</p>`}}
let grNodes=new Map(),grEdges=[];
function grlog(m){log("gr-log",m)}
async function loadGraph(){const q=document.getElementById("gr-q").value||"";try{const r=await fetch(`/api/graph/nodes?limit=100&query=${encodeURIComponent(q)}`,{headers:auth()});const j=await r.json();grNodes.clear();grEdges=[];(j.nodes||[]).forEach((n,i)=>grNodes.set(n.id,{...n,x:100+ (i*67)%800,y:80+(i*53)%280}));grEdges=j.edges||[];grlog(`loaded ${grNodes.size} nodes, ${grEdges.length} edges`);drawGraph()}catch(e){grlog("backend offline or auth needed — set token")}}
function clearGraph(){grNodes.clear();grEdges=[];drawGraph()}
let grView={x:0,y:0,w:1000,h:420};
function svgPoint(svg,ev){const r=svg.getBoundingClientRect();return{x:grView.x+(ev.clientX-r.left)/r.width*grView.w,y:grView.y+(ev.clientY-r.top)/r.height*grView.h}}
function drawGraph(){const svg=document.getElementById("gr-canvas");svg.setAttribute("viewBox",`${grView.x} ${grView.y} ${grView.w} ${grView.h}`);svg.innerHTML="";const NS="http://www.w3.org/2000/svg";grEdges.forEach(e=>{const a=grNodes.get(e.from),b=grNodes.get(e.to);if(!a||!b)return;const l=document.createElementNS(NS,"line");l.setAttribute("x1",a.x);l.setAttribute("y1",a.y);l.setAttribute("x2",b.x);l.setAttribute("y2",b.y);l.setAttribute("stroke","rgba(167,139,250,.5)");l.setAttribute("stroke-width","1");svg.appendChild(l);const t=document.createElementNS(NS,"text");t.setAttribute("x",(a.x+b.x)/2);t.setAttribute("y",(a.y+b.y)/2);t.setAttribute("fill","#aab4d4");t.setAttribute("font-size","9");t.textContent=e.label||"";svg.appendChild(t)});grNodes.forEach(n=>{const g=document.createElementNS(NS,"g");g.setAttribute("transform",`translate(${n.x},${n.y})`);g.style.cursor="grab";const c=document.createElementNS(NS,"circle");c.setAttribute("r","16");c.setAttribute("fill","rgba(34,211,238,.25)");c.setAttribute("stroke","#22d3ee");g.appendChild(c);const t=document.createElementNS(NS,"text");t.setAttribute("text-anchor","middle");t.setAttribute("dy","4");t.setAttribute("fill","#f2f5ff");t.setAttribute("font-size","9");t.textContent=String(n.label||n.id).slice(0,10);g.appendChild(t);let moved=false;g.addEventListener("pointerdown",ev=>{ev.preventDefault();ev.stopPropagation();moved=false;g.setPointerCapture(ev.pointerId);const move=e2=>{e2.preventDefault();const p=svgPoint(svg,e2);n.x=p.x;n.y=p.y;moved=true;drawGraph()};const up=e2=>{g.removeEventListener("pointermove",move);g.removeEventListener("pointerup",up);if(!moved&&e2.button===0)expandNode(n.id)};g.addEventListener("pointermove",move);g.addEventListener("pointerup",up)});g.addEventListener("contextmenu",ev=>{ev.preventDefault();showMenu(ev.clientX,ev.clientY,n)});svg.appendChild(g)});
if(!svg.dataset.panbound){svg.dataset.panbound="1";let pan=null;svg.addEventListener("pointerdown",ev=>{if(ev.target!==svg)return;ev.preventDefault();pan={x:ev.clientX,y:ev.clientY,vx:grView.x,vy:grView.y};svg.setPointerCapture(ev.pointerId)});svg.addEventListener("pointermove",ev=>{if(!pan)return;ev.preventDefault();const r=svg.getBoundingClientRect();grView.x=pan.vx-(ev.clientX-pan.x)/r.width*grView.w;grView.y=pan.vy-(ev.clientY-pan.y)/r.height*grView.h;svg.setAttribute("viewBox",`${grView.x} ${grView.y} ${grView.w} ${grView.h}`)});svg.addEventListener("pointerup",()=>pan=null);svg.addEventListener("wheel",ev=>{ev.preventDefault();const f=ev.deltaY>0?1.15:0.87;const r=svg.getBoundingClientRect();const mx=grView.x+(ev.clientX-r.left)/r.width*grView.w,my=grView.y+(ev.clientY-r.top)/r.height*grView.h;grView.w=Math.min(4000,Math.max(200,grView.w*f));grView.h=grView.w*420/1000;grView.x=mx-(ev.clientX-r.left)/r.width*grView.w;grView.y=my-(ev.clientY-r.top)/r.height*grView.h;svg.setAttribute("viewBox",`${grView.x} ${grView.y} ${grView.w} ${grView.h}`)},{passive:false})}}
async function expandNode(id){try{const r=await fetch(`/api/graph/expand/${id}`,{headers:auth()});const j=await r.json();(j.nodes||[]).forEach((n,i)=>{if(!grNodes.has(n.id))grNodes.set(n.id,{...n,x:200+(Math.random()*500),y:100+(Math.random()*220)})});(j.edges||[]).forEach(e=>grEdges.push(e));grlog(`expanded ${id}: +${(j.nodes||[]).length} nodes`);drawGraph()}catch(e){grlog("expand failed")}}
function showMenu(x,y,n){const m=document.getElementById("gr-menu");m.style.display="block";m.style.left=x+"px";m.style.top=y+"px";m.innerHTML="";[["🔬 Deep research",()=>graphAction("deep",n)],["⚡ Recoll fast search",()=>graphAction("fast",n)],["🔎 Recoll search",()=>graphAction("recoll",n)],["📋 Show facts",()=>graphFacts(n)],["✖ Close",()=>m.style.display="none"]].forEach(([label,fn])=>{const b=document.createElement("button");b.textContent=label;b.className="btn ghost";b.style.display="block";b.style.width="100%";b.style.margin="2px 0";b.onclick=()=>{m.style.display="none";fn()};m.appendChild(b)});document.addEventListener("click",()=>m.style.display="none",{once:true})}
async function graphFacts(n){try{const r=await fetch(`/api/graph/facts?keyword=${encodeURIComponent(n.label)}&limit=5`,{headers:auth()});const j=await r.json();(j.facts||[]).forEach(f=>grlog(`fact: ${f.fact_text.slice(0,120)}`));if(!(j.facts||[]).length)grlog("no facts for "+n.label)}catch(e){grlog("facts failed")}}
async function graphAction(kind,n){if(kind==="deep"){show("Research");document.getElementById("rs-q").value=n.label;startResearch();return}grlog(`${kind} queued for "${n.label}"`);try{localStorage.setItem("recoll_query",n.label)}catch(e){}if(kind!=="deep"){show("Recoll");const el=document.getElementById("r-q");if(el&&!el.value)el.value=n.label}}
async function startResearch(){const q=document.getElementById("rs-q").value.trim();if(!q)return;try{const r=await fetch("/api/jobs/research",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({query:q,session_id:document.getElementById("rs-s").value||null})});const j=await r.json();if(!j.job_id){log("rs-term","failed: "+(j.error||"")) ;return}rsjob=j.job_id;log("rs-term","job "+rsjob);const es=new EventSource(`/api/jobs/${rsjob}/stream`);es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="log")log("rs-term",m.msg);if(m.type==="progress")document.getElementById("rs-bar").style.width=(100*m.done/Math.max(1,m.total))+"%";if(m.type==="report")previewReport(m.path.split(/[\\/]/).pop());if(m.type==="done"){log("rs-term","done ok="+m.ok);es.close();listReports()}};es.onerror=()=>es.close()}catch(e){log("rs-term","failed — check token")}}
async function listReports(){try{const r=await fetch("/api/research/reports?limit=20",{headers:auth()});const j=await r.json();const box=document.getElementById("rs-list");box.innerHTML="";(j.reports||[]).forEach(f=>{const d=document.createElement("div");d.className="doc";d.innerHTML=`<span>${f.name}</span><span style="color:var(--mut)">${f.kb} KB</span>`;const b=document.createElement("button");b.className="btn ghost";b.textContent="Preview";b.onclick=()=>previewReport(f.name);d.appendChild(b);const dl=document.createElement("button");dl.className="btn ghost";dl.textContent="Download";dl.onclick=async()=>{try{const rr=await fetch(`/api/research/report?name=${encodeURIComponent(f.name)}`,{headers:auth()});const jj=await rr.json();const blob=new Blob([jj.text||""],{type:"text/markdown"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}catch(e){log("rs-term","download failed")}};d.appendChild(dl);box.appendChild(d)})}catch(e){log("rs-term","list failed")}}
let rsCurrent={name:"",text:""};async function previewReport(name){try{const r=await fetch(`/api/research/report?name=${encodeURIComponent(name)}`,{headers:auth()});const j=await r.json();rsCurrent={name,text:(j.text||"")};document.getElementById("rs-preview").textContent=(j.text||j.error||"").slice(0,20000)}catch(e){log("rs-term","preview failed")}}
function saveReport(){const fmt=document.getElementById("rs-fmt").value||".md";if(!rsCurrent.text){log("rs-term","preview a report first, then save");return}const base=(rsCurrent.name||"report.md").replace(/\.md$/i,"");if(fmt===".md"){const blob=new Blob([rsCurrent.text],{type:"text/markdown"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=base+".md";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);log("rs-term","saved "+base+".md")}else{const w=window.open("","_blank");const esc=rsCurrent.text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>");w.document.write(`<html><head><title>${base}</title><style>body{font:14px/1.6 Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px}</style></head><body><h1>${base}</h1><div>${esc}</div><script>onload=()=>{print()}<\/script></body></html>`);w.document.close();log("rs-term","PDF dialog opened — choose Save as PDF")}}
function logicShow(rows,kind){const box=document.getElementById("l-list");box.innerHTML="";(rows||[]).forEach(r=>{const d=document.createElement("div");d.className="doc";if(kind==="mod")d.innerHTML=`<span><b>${String(r.name||"").replace(/</g,"&lt;")}</b> <span style="color:var(--mut)">${String(r.category||"")}</span><br><span style="color:var(--mut)">${String(r.summary||"").replace(/</g,"&lt;").slice(0,160)}</span></span>`;else if(kind==="ses")d.innerHTML=`<span>${String(r.session||"").replace(/</g,"&lt;")}</span><span style="color:var(--mut)">${r.entries||0} entries</span>`;else d.innerHTML=`<span>${String(r.content||"").replace(/</g,"&lt;").slice(0,160)}</span><span style="color:var(--mut)">${String(r.session||"")} · ${r.importance||""}</span>`;box.appendChild(d)})}
async function loadModules(){try{const q=document.getElementById("l-q").value||"";const r=await fetch(`/api/logic/modules?search=${encodeURIComponent(q)}&limit=50`,{headers:auth()});const j=await r.json();log("l-term",`modules: ${(j.items||[]).length}`);logicShow(j.items,"mod")}catch(e){log("l-term","modules failed")}}
async function loadSessions(){try{const r=await fetch("/api/memory/sessions?limit=50",{headers:auth()});const j=await r.json();log("l-term",`sessions: ${(j.items||[]).length}`);logicShow(j.items,"ses")}catch(e){log("l-term","sessions failed")}}
async function loadMemories(){try{const s=document.getElementById("l-session").value||"";const r=await fetch(`/api/memory/entries?session=${encodeURIComponent(s)}&limit=30`,{headers:auth()});const j=await r.json();log("l-term",`memories: ${(j.items||[]).length}`);logicShow(j.items,"mem")}catch(e){log("l-term","memories failed")}}
let lljob=null;async function startLogicLearn(){const payload={input:document.getElementById("ll-input").value,limit:document.getElementById("ll-limit").value,dry:document.getElementById("ll-dry").checked};document.getElementById("ll-docs").innerHTML="";document.getElementById("ll-bar").style.width="0";try{const r=await fetch("/api/jobs/logic-learn",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();lljob=j.job_id;log("ll-term","job "+lljob);const es=new EventSource(`/api/jobs/${lljob}/stream`);es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="log")log("ll-term",m.msg);if(m.type==="progress")document.getElementById("ll-bar").style.width=(100*m.done/Math.max(1,m.total))+"%";if(m.type==="document"){const d=document.createElement("div");d.className="doc";d.innerHTML=`<span>${m.name}</span><span style="color:var(--mut)">${m.facts} modules</span><span>${m.status==="done"?"✅":"❌"}</span>`;document.getElementById("ll-docs").appendChild(d)}if(m.type==="done"){log("ll-term","done ok="+m.ok);es.close()}};es.onerror=()=>es.close()}catch(e){log("ll-term","failed — check token")}}
async function cancelLogic(){if(!lljob)return;await fetch(`/api/jobs/${lljob}/cancel`,{method:"POST",headers:auth()});log("ll-term","cancel sent")}
async function startConsolidate(){try{const r=await fetch("/api/jobs/consolidate",{method:"POST",headers:auth()});const j=await r.json();log("l-term","consolidation job "+j.job_id+" (watch server log for progress)")}catch(e){log("l-term","consolidation failed")}}
show("Guided");health();loadSchema();
</script>
